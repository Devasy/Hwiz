name: Release & Publish Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: false
        default: 'manual-build'

jobs:
  build-and-release:
    name: Build Signed Bundle & APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./health_analyzer
        run: flutter pub get

      - name: Setup Android Keystore & key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > health_analyzer/android/upload-keystore.jks

          cat <<EOF > health_analyzer/android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle (.aab)
        working-directory: ./health_analyzer
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Build Android APK (.apk)
        working-directory: ./health_analyzer
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Build Artifacts (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            health_analyzer/build/app/outputs/bundle/release/app-release.aab
            health_analyzer/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            if [ "$TAG" = "manual-build" ]; then
              TAG="build-$(date +'%Y%m%d-%H%M%S')"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            health_analyzer/build/app/outputs/bundle/release/app-release.aab
            health_analyzer/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Google Play (Optional)
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.devasy.lablens
          releaseFiles: health_analyzer/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
